<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برای وزه کوچولوم ♡</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#fff8fa,#f8f3ff);color:#29242a}.card{width:min(520px,100%);padding:34px 26px 30px;text-align:center;background:rgba(255,255,255,.9);border:1px solid #f0e7ec;border-radius:28px;box-shadow:0 18px 55px rgba(80,50,70,.12)}.heart{font-size:34px;margin-bottom:10px}h1{font-size:25px;margin:0 0 18px}.message{font-family:Georgia,serif;font-size:19px;line-height:1.8;color:#625a61;background:#fffafb;border-radius:20px;padding:20px 16px;margin:0 0 24px;direction:ltr}.play{border:0;border-radius:999px;padding:13px 25px;cursor:pointer;background:#29242a;color:white;font-size:15px}.hint{font-size:12px;color:#999;margin-top:16px}</style></head><body><main class="card"><div class="heart">♡</div><h1>یه چیزی برا وزه کوچولوم</h1><div class="message">My heart is forever for my little Nini</div><button class="play" onclick="toggleMusic()">▶ پخش آهنگ</button><audio id="music" src="song.mp3" preload="metadata"></audio><div class="hint">برای شنیدن آهنگ روی دکمه بزن 🎵</div></main><script>const audio=document.getElementById('music'),btn=document.querySelector('.play');function toggleMusic(){if(audio.paused){audio.play();btn.textContent='❚❚ توقف آهنگ'}else{audio.pause();btn.textContent='▶ پخش آهنگ'}}audio.addEventListener('ended',()=>btn.textContent='▶ پخش آهنگ');</script></body></html>
